[metadata]
name = worktree-rescue
version = 0.1.0
description = Quiet worktree cleanup with verified local recovery archives
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
author = popiolkoks1
url = https://github.com/popiolkoks1/worktree-rescue
classifiers =
    Operating System :: POSIX
    Programming Language :: Python :: 3
    Development Status :: 3 - Alpha

[options]
python_requires = >=3.9
py_modules = rescue
package_dir =
    = scripts

[options.entry_points]
console_scripts =
    worktree-rescue = rescue:entrypoint
