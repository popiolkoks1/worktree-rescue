name: Bug report
description: Report a reproducible cleanup or recovery problem.
body:
  - type: markdown
    attributes:
      value: "Use synthetic data. Do not upload recovery archives, credentials or personal files."
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Rescue, Claude Code, OS, Python and Git versions
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Disposable repository commands, expected result and actual result
    validations:
      required: true
